services:
  mex-admin-frontend:
    build:
      context: .
    image: mex-admin:local
    ports:
      - 8030:8030
    environment:
      - MEX_ADMIN_FRONTEND_HOST=0.0.0.0
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8030').raise_for_status()" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: admin-frontend
    depends_on:
      mex-admin-api:
        condition: service_healthy
  mex-admin-api:
    build:
      context: .
    image: mex-admin:local
    ports:
      - 8031:8031
    environment:
      - MEX_ADMIN_API_HOST=0.0.0.0
      # keep in sync with .github/workflows/testing.yml
      - MEX_ADMIN_USER_DATABASE={"read":{"reader":"read_pw"},"write":{"writer":"write_pw"}}
      - MEX_BACKEND_API_KEY=write_key
      - MEX_BACKEND_API_URL=http://mex-backend:8080/
      - MEX_IDENTITY_PROVIDER=backend
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8031/_system/check').raise_for_status()" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: admin-api
    depends_on:
      mex-backend:
        condition: service_healthy
  mex-backend:
    image: ghcr.io/robert-koch-institut/mex-backend:4.8.0@sha256:ef85eb36838643acb57fa6646d3f6c232c1f9996ed1f77036842cb48b99d96cf
    ports:
      - 8080:8080
    environment:
      - MEX_BACKEND_HOST=0.0.0.0
      - MEX_BACKEND_API_KEY_DATABASE={"read":["read_key"],"write":["write_key"]}
      - MEX_DEBUG=True
      - MEX_GRAPH_URL=neo4j://neo4j:7687
      - MEX_IDENTITY_PROVIDER=graph
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/v0/_system/check').raise_for_status()" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    # the testing backend serves the graph flush endpoint,
    # which the integration test suite relies on
    entrypoint: testing-backend
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:2026.10.1-community@sha256:86f8e01402fd0d5fd23e8968375fefdc21284a5c1751fa3fa3de8091a08b6dd6
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - 7687:7687
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  neo4j_data:
